services:
  mneme-service:
    build: .
    ports:
      - "0.0.0.0:3001:3001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://mneme:${PG_PASSWORD:-mneme123}@postgres:5432/mneme
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - MNEME_SERVICE_TOKEN=${MNEME_SERVICE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mneme
      POSTGRES_USER: mneme
      POSTGRES_PASSWORD: ${PG_PASSWORD:-mneme123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mneme"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
